<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #tabs-row {
      position: absolute;
      left: 0;
      right: 0;
      top: 196px;
      display: flex;
      justify-content: center;
      gap: 18px;
    }
    .tabs-chip {
      position: relative;
      padding: 14px 26px;
      border: 3px solid #2a3b5c;
      border-radius: 16px;
      background: #121d30;
      color: #7d8fae;
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.08em;
    }
    .tabs-x {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 50%;
      height: 5px;
      margin-top: -2px;
      background: #ff5a5f;
      transform-origin: 0% 50%;
    }
  </style>
  <div id="root" data-composition-id="tabs" data-width="1080" data-height="1920">
    <div id="tabs-row" class="clip" data-start="0" data-duration="{{TABS_END}}">
      <div id="tabs-c1" class="tabs-chip">PROBLEM 1<div id="tabs-x1" class="tabs-x"></div></div>
      <div id="tabs-c2" class="tabs-chip">PROBLEM 2<div id="tabs-x2" class="tabs-x"></div></div>
      <div id="tabs-c3" class="tabs-chip">PROBLEM 3<div id="tabs-x3" class="tabs-x"></div></div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const on = { backgroundColor: "{{ACCENT}}", borderColor: "{{ACCENT}}", color: "#0a1220" };
      const off = { backgroundColor: "#121d30", borderColor: "#2a3b5c", color: "#7d8fae" };
      // Chips pop in under the hook's stamp, then each one lights as its problem is spoken.
      ["#tabs-c1", "#tabs-c2", "#tabs-c3"].forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, {{CHIPS_AT}} + i * 0.1);
      });
      ["#tabs-x1", "#tabs-x2", "#tabs-x3"].forEach((x) => tl.set(x, { scaleX: 0 }, 0));
      ["#tabs-c1", "#tabs-c2", "#tabs-c3"].forEach((c) => tl.set(c, off, 0));
      const starts = [{{P1}}, {{P2}}, {{P3}}];
      starts.forEach((t, i) => {
        tl.fromTo(`#tabs-c${i + 1}`, off, { ...on, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
        if (i > 0) {
          tl.fromTo(`#tabs-c${i}`, on, { ...off, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(`#tabs-x${i}`, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t + 0.05);
        }
      });
      tl.fromTo("#tabs-x3", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, {{X3_AT}});
      window.__timelines["tabs"] = tl;
    })();
  </script>
</template>
